name: Deploy Hugo Website


on:

  # Allows normal pushes to main to deploy the website.
  # Note: pushes made using GITHUB_TOKEN do not trigger another workflow.
  push:
    branches:
      - main

  # Allows manual deployment from the GitHub Actions UI.
  workflow_dispatch:

  # Allows this workflow to be called by another workflow.
  workflow_call:


# Prevent overlapping Hugo deployments
concurrency:
  group: hugo-deployment
  cancel-in-progress: false


permissions:
  contents: read
  pages: write
  id-token: write


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive


      - name: Setup Pages
        uses: actions/configure-pages@v5


      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true


      - name: Build Hugo website
        run: |
          hugo --minify


      - name: Upload Hugo artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public


  deploy:

    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
